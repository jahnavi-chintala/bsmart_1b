[project]
name = "bsmart-gold"
version = "0.1.0"
description = "Reusable, mapping-table driven silver -> gold pipeline for B-SMART"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pyspark==3.5.3", "pytest", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
